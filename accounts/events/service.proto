syntax = "proto3";

package events;

option go_package = "github.com/prosperofair/proto/accountevents";

message SubscribeRequest {
  int64 account_id = 1;
}

message Event {
  int32 account_id = 1;
  string type = 2;
  string payload = 3; // json
  int64 timestamp = 4;
  map<string, string> labels = 5; // routing keys (account_id, chat_id, message_id, ...) — duplicated for broker/non-Go consumers
}

service EventService {
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}
