syntax = "proto3";

package actions;

option go_package = "github.com/prosperofair/proto/accountactions";

message Action {
  int64 id = 1;
  int32 to_account_id = 2;

  string type = 3;
  string payload = 4;
  string status = 5;

  string error_message = 6;

  int64 created_at = 7; // unix nano
  int64 updated_at = 8; // unix nano

  // Dispatcher metadata.
  int32 priority = 9;
  string lane = 10;
  string key = 11;     // empty if action has no sticky-exclusion key
  int32 attempts = 12; // 1 on first delivery, +1 on each Reserve
}

// StreamHello: opening handshake. One stream per (account, lane).
message StreamHello {
  int64 account_id = 1;
  int32 capacity = 2;
  string lane = 3;
}

// AckResult. error_class ∈ {"transient", "rate_limited", "permanent"};
// empty/unknown on a non-done status is treated as permanent.
message AckResult {
  int64 action_id = 1;
  string status = 2;
  string error_message = 3;
  string error_class = 4;
  int64 retry_after_ms = 5;
}

// Heartbeat extends lease_until for a long-running action.
message Heartbeat {
  int64 action_id = 1;
}

// ActionAck: first message MUST be hello, then results / heartbeats.
message ActionAck {
  oneof body {
    StreamHello hello = 1;
    AckResult result = 2;
    Heartbeat heartbeat = 3;
  }
}

service ActionService {
  // Stream: bot opens, sends hello, then receives Action and sends
  // AckResult/Heartbeat. Server caps in-flight at hello.capacity.
  rpc Stream(stream ActionAck) returns (stream Action);
}
